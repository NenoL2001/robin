[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-bot"
version = "0.1.0"
description = "Realtime portfolio monitor and semiconductor opportunity research bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.90.0",
  "PyYAML>=6.0.1",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "websocket-client>=1.8.0",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
memory = ["mem0ai>=0.1.0"]

[project.scripts]
portfolio-bot = "portfolio_bot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
