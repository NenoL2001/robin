data_dir: .portfolio_bot
holdings_path: holdings.yaml
analysts_path: analysts.yaml
strategy_root: strategy_skills
timezone: America/New_York

monitor:
  realtime_poll_seconds: 30
  deep_scan_seconds: 300
  report_time: "08:45"
  major_move_cooldown_minutes: 30
  thresholds:
    intraday_percent: 5.0
    realtime_percent: 3.0
    portfolio_percent: 2.0

research:
  option_min_days: 180
  option_max_days: 548
  option_max_premium: 1500
  option_max_spread_percent: 35
  min_news_relevance: 0.55
  max_news_per_symbol: 3
  web_search_enabled: true
  web_search_provider: duckduckgo
  web_search_api_provider: tavily
  web_search_max_results: 5
  web_search_timeout_seconds: 8
  default_universe:
    - INTC
    - AXTI
    - AEHR
    - POET
    - NVDA
    - AMD
    - AVGO
    - TSM
    - ASML
    - AMAT
    - LRCX
    - KLAC
    - TER
    - ACLS
    - COHR
    - MRVL
    - "ON"
    - WOLF
  leveraged_etfs:
    - USD
  comparison_etfs:
    - SOXL

notifications:
  imessage_enabled: true
  email_enabled: false
  agentmail_enabled: false
  agentmail_major_alerts_enabled: true
  agentmail_market_hours_cooldown_minutes: 10
  agentmail_off_hours_cooldown_minutes: 45
  agentmail_off_hours_extreme_move_percent: 8.0
  batch_realtime_alerts: true
  semantic_dedupe_enabled: true
  dry_run: false

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  monitor_model: deepseek-v4-flash
  event_model: deepseek-v4-pro
  reasoning_effort: high
  monitor_thinking_enabled: false
  event_thinking_enabled: true

memory:
  enabled: true
  sqlite_path: memory.sqlite
  max_context_items: 8
  open_source_backend: mem0
  open_source_enabled: false

paper:
  sqlite_path: paper_portfolio.sqlite
  starting_cash: 100000

backtest:
  sqlite_path: backtest.sqlite
  default_slippage_bps: 10
  default_commission: 0

strategy_risk:
  max_paper_order_equity_pct: 0.02
  max_option_order_equity_pct: 0.005
  paper_drawdown_warn: -0.025
  paper_drawdown_stop: -0.05
  min_backtest_trades: 8
  max_backtest_drawdown: -0.35
  auto_paper_orders_enabled: true
  max_auto_paper_orders_per_day: 3
  paper_order_cooldown_hours: 8
  require_official_source_for_earnings_orders: true

strategy_research:
  enabled: true
  max_queries_per_strategy: 8
  official_sources_first: true
  secondary_search_on_gap: true

strategy_lab:
  daily_factor_iteration_enabled: true
  allow_new_factor_candidates: true
  min_factor_observations_for_orders: 20

market_bars:
  enabled: true
  sqlite_path: market_bars.sqlite
  default_windows:
    - 1d
    - 5d
    - 20d

relation_graph:
  enabled: true
  sqlite_path: relation_graph.sqlite
  min_confidence: 0.55

evidence_ranker:
  max_items_per_symbol: 5

report_verifier:
  enabled: true
  block_on_wrong_date: true

report:
  max_sync_seconds: 30

runtime:
  sqlite_path: runtime.sqlite

logging:
  enabled: true
  level: INFO
  jsonl_path: logs/portfolio-bot.jsonl
  profile_sample_seconds: 60

health:
  check_seconds: 30
  stale_job_seconds: 900
  alert_cooldown_minutes: 15
  max_failed_jobs: 20
  quote_stale_seconds: 1800
  alerts_enabled: true

data_hub:
  news_cache_minutes: 15
  quote_cache_seconds: 60

metrics:
  backend: thread
  max_workers: 4

orchestration:
  enabled: true
  tick_seconds: 60
  strategy_review_time: "16:30"
  code_iteration_time: "17:30"
  profile_iterations: 2

agent_harness:
  enabled: true
  engine: langgraph
  default_model: deepseek-v4-flash
  deep_model: deepseek-v4-pro
  max_turns: 4
  max_tool_calls: 8
  max_run_seconds: 300
  max_auto_changed_files: 3
  max_patch_lines: 250
  auto_code_iteration: true
  auto_patch_enabled: true
  auto_restart_after_patch: true
  auto_source_config_enabled: false
  auto_restart_after_source_config: false
  require_verification: true

workers:
  enabled: true
  orchestrator_processes: 1
  realtime_processes: 1
  news_processes: 1
  ai_processes: 1
  report_processes: 1
  agent_processes: 1
  strategy_processes: 1
  paper_processes: 1
  backtest_processes: 1
  health_processes: 1
  maintenance_processes: 1
  heartbeat_seconds: 30
  restart_backoff_seconds: 5

rate_limits:
  finnhub_concurrency: 4
  news_timeout_seconds: 10
